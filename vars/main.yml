---
# vars file for rsyslog

rsyslog_packages:
  - rsyslog

rsyslog_service: rsyslog

_rsyslog_work_directory:
  default: /var/lib/rsyslog
  Debian: /var/spool/rsyslog

rsyslog_work_directory: "{{ _rsyslog_work_directory[ansible_facts['os_family']] | default(_rsyslog_work_directory['default']) }}"

_rsyslog_default_mods:
  default:
    - imuxsock
    - imjournal
  Alpine:
    - imuxsock
    - imklog

rsyslog_default_mods: "{{ _rsyslog_default_mods[ansible_facts['os_family']] | default(_rsyslog_default_mods['default']) }}"

# The command that validates an additional config file: rsyslogd itself when item.validate is set, otherwise a command
# that always succeeds. This uses the loop variable `item`, so it can only be used inside a loop over rsyslog_rsyslog_d_files.
_rsyslog_validate_command: "{{ 'rsyslogd -N1 -f %s' if item.validate | default(false) else 'true %s' }}"
